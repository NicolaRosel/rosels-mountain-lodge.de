<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden — Rosel's Mountain Lodge</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--bg); padding: 2rem; }
    .error-page__code { font-family: var(--font-serif); font-size: clamp(5rem,15vw,9rem); font-weight: 300; color: var(--rose); line-height: 1; font-style: italic; }
    .error-page h1 { font-family: var(--font-serif); font-size: clamp(1.4rem,4vw,2rem); font-weight: 300; color: var(--ink); margin: 1rem 0 0.8rem; }
    .error-page p { font-family: var(--font-sans); font-size: 0.95rem; color: var(--ink-mid); line-height: 1.8; max-width: 420px; margin: 0 auto 2rem; }
    .error-page__btn { display: inline-block; font-family: var(--font-sans); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; background: var(--rose); color: #fff; padding: 0.9rem 2.2rem; border-radius: var(--radius); text-decoration: none; transition: background 0.25s; }
    .error-page__btn:hover { background: var(--ink); }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <div class="error-page__code">404</div>
      <h1>Diese Seite gibt es leider nicht</h1>
      <p>Vielleicht hat sich ein Tippfehler eingeschlichen — oder die Seite ist umgezogen. Auf der Startseite finden Sie alles rund um die Ferienwohnung, das Schwimmbad und die Sauna.</p>
      <a href="/" class="error-page__btn">Zur Startseite</a>
    </div>
  </main>
</body>
</html>
